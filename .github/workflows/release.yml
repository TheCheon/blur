name: Release 1.1

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run dist:linux -- --publish never
          - os: windows-latest
            cmd: npm run dist:win -- --publish never
          - os: macos-latest
            cmd: npm run dist:mac -- --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build binaries
        run: ${{ matrix.cmd }}

      - name: Clean up build artifacts
        run: |
          rm -rf release/linux-unpacked release/*.yml release/*.yaml 2>/dev/null || true
          echo "Cleaned build artifacts. Remaining files:"
          ls -lh release/ || echo "release/ is empty"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Publish release assets
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: all-artifacts/**
          generate_release_notes: true

      - name: Fallback notice when publish is blocked
        if: steps.publish_release.outcome != 'success'
        run: |
          echo "::warning::Release publishing was blocked (commonly due usage/rate limits), but binaries were built and are available as workflow artifacts."
          echo "::warning::Download artifacts from this run and attach them to the GitHub Release manually once limits reset."
