<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:; connect-src 'self' http://127.0.0.1:5000 ws:; img-src 'self' data: file:;" />
    <title>Blur Faces</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Blur Faces v1.0</h1>
        <div id="tabs">
          <button class="tab active" data-tab="library">Library</button>
          <button class="tab" data-tab="edit">Edit</button>
        </div>
        <div id="headerControls" class="controls">
          <button id="importBtn" class="headerBtn">Import Images</button>
          <button id="detectAllBtn" class="headerBtn">Detect All</button>
          <button id="exportBtn" class="headerBtn">Export All</button>
        </div>
      </header>
      <main>
        <section id="library" class="tabSection">
          <div id="libraryToolbar">
            <button id="applyAllBtn">Export All Masks</button>
          </div>
          <div id="libraryGrid" class="gridArea"></div>
        </section>
        <section id="edit" class="tabSection hidden">
          <div id="editGrid" class="editGridArea"></div>
          <div id="filmstripEdit" class="filmstrip"></div>
        </section>
        <section id="editor" class="hidden">
          <div id="editorToolbar">
            <!-- editor toolbar removed for simplified darktable-like UI -->
          </div>
          <div id="canvasWrap">
            <canvas id="editorCanvas"></canvas>
          </div>
          <div id="filmstrip" class="filmstrip"></div>
        </section>
        <section id="batch" class="hidden">
          <div id="batchToolbar">
            
            
          </div>
          <div id="batchGrid"></div>
        </section>
      </main>
      <!-- Preferences removed -->
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
